<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Daniel Bullon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-btn">← Volver al Inicio</a>
        <div class="game">
            <h1>Tic Tac Toe</h1>
            <div class="game-info">
                <p class="turn-indicator">Turno: <span id="current-player">X</span></p>
                <p class="score">
                    Jugador X: <span id="score-x">0</span> | 
                    Jugador O: <span id="score-o">0</span> | 
                    Empates: <span id="score-draw">0</span>
                </p>
            </div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button class="reset-btn" id="reset-btn">Nueva Partida</button>
            <div class="winner-message" id="winner-message">
                <div class="winner-text">
                    <p id="winner-text"></p>
                    <button class="play-again-btn" id="play-again-btn">Jugar de Nuevo</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
